<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <clipPath id="canvas-clip">
      <rect x="0" y="0" width="1080" height="1350" />
    </clipPath>
    <linearGradient id="top-scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F4ED" stop-opacity="0.98" />
      <stop offset="58%" stop-color="#F6F4ED" stop-opacity="0.93" />
      <stop offset="82%" stop-color="#F6F4ED" stop-opacity="0.62" />
      <stop offset="100%" stop-color="#F6F4ED" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="bottom-scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10294B" stop-opacity="0.0" />
      <stop offset="32%" stop-color="#10294B" stop-opacity="0.82" />
      <stop offset="44%" stop-color="#10294B" stop-opacity="0.97" />
      <stop offset="64%" stop-color="#10294B" stop-opacity="0.99" />
      <stop offset="100%" stop-color="#10294B" stop-opacity="1" />
    </linearGradient>
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#10294B" flood-opacity="0.12" />
    </filter>
  </defs>

  <g id="layer-background">
    <rect x="0" y="0" width="1080" height="1350" fill="#F6F4ED" />
  </g>

  <g id="layer-illustration">
    <g clip-path="url(#canvas-clip)">
      <image id="source-artwork" href="../source_illustrations/04_raw.png" x="0" y="-96.43" width="1080" height="1446.43" preserveAspectRatio="xMidYMid slice" />
      <rect x="0" y="0" width="1080" height="435" fill="url(#top-scrim)" />
      <rect x="0" y="1214" width="1080" height="136" fill="url(#bottom-scrim)" />
    </g>
    
  </g>

  <g id="layer-header">
    <rect x="64" y="56" width="100" height="108" rx="20" fill="#FFFFFF" fill-opacity="0.96" stroke="#10294B" stroke-opacity="0.14" stroke-width="1.5" filter="url(#soft-shadow)" />
    <image id="doan-emblem" href="../identity/derived/huy-hieu-doan-clean.png" x="72" y="63.49" width="84" height="93.02" preserveAspectRatio="xMidYMid meet" />

    <g id="header-resolution-badge">
      <rect x="184" y="68" width="304" height="42" rx="21" fill="#10294B" />
      <circle cx="208" cy="89" r="5.5" fill="#E52E37" />
      <text x="224" y="95" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.1" fill="#F6F4ED">NGHỊ QUYẾT 57-NQ/TW</text>
    </g>

    <g id="header-index-pill">
      <rect x="904" y="68" width="112" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.94" stroke="#10294B" stroke-opacity="0.18" stroke-width="1.5" />
      <circle cx="928" cy="89" r="5" fill="#075837" />
      <text x="972" y="96" text-anchor="middle" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="0.6" fill="#10294B">04/05</text>
    </g>
  </g>

  <g id="layer-typography">
    
    <g id="micro-note-pill">
      <rect x="64" y="182" width="409" height="34" rx="17" fill="#EAF4EE" stroke="#075837" stroke-opacity="0.45" stroke-width="1.5" />
      <circle cx="84" cy="199" r="4.5" fill="#075837" />
      <text x="98" y="205" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="18" font-weight="700" fill="#075837">Gợi ý phần việc thanh niên tại cơ sở</text>
    </g>
    <rect x="64" y="240" width="7" height="149" rx="3.5" fill="#1764B0" />
    <text id="poster-title" x="88" y="280" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-0.6" fill="#10294B"><tspan x="88" dy="0" fill="#10294B">THANH NIÊN ĐỒNG NAI</tspan><tspan x="88" dy="58" fill="#10294B">HÀNH ĐỘNG</tspan></text>
    <text id="poster-subtitle" x="88" y="382" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="26" font-weight="600" fill="#1764B0">Học kỹ năng số · Hỗ trợ người dân · Sáng tạo</text>
  </g>



  <g id="layer-footer">
    <rect x="0" y="1214" width="1080" height="136" fill="#10294B" />
    <rect x="0" y="1214" width="1080" height="4" fill="#F0C76D" />
    <text id="footer-event" x="64" y="1256" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="19" font-weight="700" fill="#F6F4ED">Trại Thanh niên số thành phố Đồng Nai 2026</text>
    <text id="footer-source" x="64" y="1286" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="18" font-weight="500" fill="#F0C76D">Nguồn: Nghị quyết 57-NQ/TW, Bộ Chính trị (22/12/2024).</text>
  </g>
</svg>
